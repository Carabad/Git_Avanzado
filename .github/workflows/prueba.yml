name: Prueba Token
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  check-token:
    runs-on: self-hosted
    steps:
      - name: Comparar tokens
        run: |
          $secretToken = "${{ secrets.DEV_TOKEN }}"
          $localToken = $env:LOCAL_DEV_TOKEN
          if ($secretToken -eq $localToken) {
              Write-Host "Los tokens coinciden."
              exit 0
          } else {
              Write-Host "Los tokens NO coinciden."
              exit 1
          }
