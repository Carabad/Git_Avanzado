run: |
  $dev = "$env:DEV_TOKEN"
  $local = "$env:LOCAL_DEV_TOKEN"
  Write-Host "DEV_TOKEN (longitud: $($dev.Length)): '$dev'"
  Write-Host "LOCAL_DEV_TOKEN (longitud: $($local.Length)): '$local'"
  if ($dev -eq $local) {
      Write-Host "Los tokens coinciden."
      exit 0
  } else {
      Write-Host "Los tokens NO coinciden."
      exit 1
  }
